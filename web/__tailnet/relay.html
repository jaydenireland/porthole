<!doctype html>
<meta charset="utf-8">
<title>Tailnet relay</title>
<!--
  Hidden helper the app loads once per tailnet site, on that site's origin.
  It installs the service worker there and passes the worker's requests up to
  the app page, which owns the tailnet node. The reply port goes straight
  through, so the app answers the worker directly.
-->
<script src="/__tailnet/codec.js"></script>
<script type="module">
const { upstream, appOrigin } = TailnetCodec.fromSiteLocation(location);
if (!upstream || parent === window) {
  document.body.textContent = "This page is part of Porthole and does nothing on its own.";
} else {
  navigator.serviceWorker.addEventListener("message", (ev) => {
    if (ev.data?.type === "tailnet-request") parent.postMessage(ev.data, appOrigin, [...ev.ports]);
  });
  navigator.serviceWorker.startMessages();
  (async () => {
    try {
      const reg = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
      // If an older sw.js is installed, "ready" would resolve with it and the
      // first page would be served by stale code. Check for an update and wait
      // for any new worker to take over first.
      await reg.update().catch(() => {});
      const pending = reg.installing ?? reg.waiting;
      if (pending && pending.state !== "activated") {
        await new Promise((resolve) => pending.addEventListener("statechange", () => {
          if (pending.state === "activated" || pending.state === "redundant") resolve();
        }));
      }
      await navigator.serviceWorker.ready;
      parent.postMessage({ type: "tailnet-relay-ready" }, appOrigin);
    } catch (e) {
      parent.postMessage({ type: "tailnet-relay-failed", error: String(e) }, appOrigin);
    }
  })();
}
</script>
<body></body>
