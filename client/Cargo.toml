[package]
name = "porthole-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Porthole's Tailscale client for browser tabs, built on tailscale-rs."
license = "BSD-3-Clause"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# What a page needs from the network, written against any byte stream so it
# can be tested on this machine: HTTP (hyper), TLS (rustls with the ring
# crypto library and Mozilla's root certificates), cookies, WebSockets.
bytes = "1"
cookie = "0.18"
cookie_store = { version = "0.22", default-features = false }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
psl = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", default-features = false, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
web-time = "1"
webpki-roots = "1"

# Everything else is for the browser build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Tailscale's own Rust crates (github.com/tailscale/tailscale-rs), from the
# pinned and patched checkout that build.sh prepares. See tailscale-rs.patch.
ts_capabilityversion = { path = "../tailscale-rs-src/crates/capabilities/ts_capabilityversion" }
ts_control = { path = "../tailscale-rs-src/crates/control_plane/ts_control" }
ts_control_noise = { path = "../tailscale-rs-src/crates/control_plane/ts_control_noise" }
ts_control_serde = { path = "../tailscale-rs-src/crates/control_plane/ts_control_serde" }
ts_bart = { path = "../tailscale-rs-src/crates/data_structures/ts_bart" }
ts_dataplane = { path = "../tailscale-rs-src/crates/net/ts_dataplane", default-features = false }
ts_derp = { path = "../tailscale-rs-src/crates/net/underlay/ts_derp" }
ts_netstack_smoltcp = { path = "../tailscale-rs-src/crates/net/overlay/ts_netstack_smoltcp", features = ["futures-io"] }
ts_packet = { path = "../tailscale-rs-src/crates/utils/ts_packet" }
ts_packetfilter = { path = "../tailscale-rs-src/crates/net/overlay/ts_packetfilter" }
ts_transport = { path = "../tailscale-rs-src/crates/net/ts_transport" }
ts_tunnel = { path = "../tailscale-rs-src/crates/net/protocol/ts_tunnel" }
ts_http_util = { path = "../tailscale-rs-src/crates/utils/ts_http_util" }
ts_keys = { path = "../tailscale-rs-src/crates/utils/ts_keys", features = ["serde"] }

# Browser bindings.
# "wasmbind" makes chrono read the page's clock; without it, the first
# device list crashes the client (tailscale-rs asks chrono for the time).
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["RequestMode"] }
ws_stream_wasm = { version = "0.7", features = ["tokio_io"] }

# The libraries report what they are doing through `tracing`. With the
# `console-log` feature those reports go to the browser console.
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"], optional = true }
tracing-web = { version = "0.1", optional = true }

futures-channel = "0.3"

# Random numbers come from the browser. These lines only switch that on in
# the versions of getrandom that the crates above pull in.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# In a browser, ring gets its random numbers from the page, and `time` reads
# the page's clock.
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
time = { version = "0.3", features = ["wasm-bindgen"] }
tokio-util = { version = "0.7", features = ["compat"] }
# Makes the certificate the checks use.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"], optional = true }

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1"] }
rcgen = "0.14"
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }

[features]
# The public build has neither. build.sh makes a second build with both for
# the test pages, in ../web/test/client/.
default = []
# The checks the test pages run: relayCheck, pathCheck, siteCheck and so on.
diagnostics = ["dep:rcgen"]
# Sends what the libraries report to the browser console.
console-log = ["dep:tracing-subscriber", "dep:tracing-web"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
